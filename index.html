<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>OBMC Classmate System</title>
     <style>
    body {
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-image:
            linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
            url("1298da00ed787c1fe5f63f6de2910090.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: white;
    }

    .container {
        max-width: 800px;
        animation: fadeIn 1s ease;
    }

    h2 {
        color: #fff2b8;
        text-shadow: 2px 2px 5px black;
    }

    .quote {
        color: #ffecc5 !important;
        text-shadow: 1px 1px 4px black;
    }

    .card {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        color: white;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px;
    }

    .form-control:focus {
        border-color: #fff2b8;
        box-shadow: 0 0 8px #fff2b8;
    }

    .btn {
        border-radius: 12px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.04);
    }

    .btn-primary {
        background-color: #ee5b24;
        border: none;
    }

    .btn-success {
        background-color: #006c65;
        border: none;
    }

    h5 {
        color: #fff2b8;
    }

    #output p {
        background: rgba(0, 0, 0, 0.35);
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
        animation: slideIn 0.4s ease;
    }

    .text-success {
        color: #fff2b8 !important;
        font-weight: bold;
    }

    .text-danger {
        color: #ffd6ca !important;
        font-weight: bold;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(-15px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @media (max-width: 576px) {
        .d-flex {
            flex-direction: column;
        }

        .btn {
            width: 100% !important;
        }
    }
</style>
</head>

<body>

<div class="container mt-5">
    
    <div class="text-center mb-4">
        <h2 class="fw-bold main-title">OBMC Classmates System</h2>
        <p class="text-muted quote">"Greatest thing we can do in life is find the power to forgive."</p>
    </div>

    <div class="card shadow p-4">
        <div class="mb-3">
            <input type="text" id="classmate1" class="form-control" placeholder="What is your name">
        </div>

        <div class="mb-3">
            <input type="text" id="section" class="form-control" placeholder="What section are you from">
        </div>

        <div class="mb-3">
            <input type="text" id="favorite_subject" class="form-control" placeholder="What is your favorite subject">
        </div>

        <div class="mb-3">
            <input type="text" id="miss" class="form-control" placeholder="What do you miss">
        </div>

        <div class="d-flex gap-2">
            <input type="button" py-click="add_classmate" class="btn btn-primary w-50" value="Add">
            <input type="button" py-click="show_classmates" class="btn btn-success w-50" value="Show List">
        </div>
    </div>

    <div class="card shadow mt-4 p-3">
        <h5 class="fw-bold">📋 Classmate List</h5>
        <div id="output" class="mt-2"></div>
    </div>

</div>

<py-script src="main.py"></py-script>

</body>
</html>
